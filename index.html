<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scanini</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #111827;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 25px 16px 30px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 7px;
            font-size: 14px;
            color: #6b7280;
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Card */
        .card {
            display: block;
            position: relative;
            overflow: hidden;

            background: white;
            border-radius: 20px;

            text-decoration: none;
            color: inherit;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);

            transition: 0.25s ease;
        }

        .card:active {
            transform: scale(0.97);
        }

        /* Image */
        .image-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;

            transition: transform 0.35s ease;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        /* Text */
        .card-content {
            padding: 15px 17px 17px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
        }

        .card-description {
            margin-top: 5px;
            font-size: 13px;
            color: #6b7280;
        }

        /* Arrow */
        .arrow {
            position: absolute;

            right: 16px;
            bottom: 16px;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #111827;
            color: white;

            font-size: 18px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 28px;

            font-size: 12px;
            color: #9ca3af;
        }

        /* PC */
        @media (min-width: 700px) {
            .page {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- HEADER -->
        <header class="header">

            <div class="logo">
                LINKINI
            </div>

            <div class="subtitle">
               Votre centre, à portée de clic 👂✨
            </div>

        </header>


        <!-- 3 LINKS -->
        <section class="links">


            <!-- ========================= -->
            <!-- LINK 1 : FACEBOOK -->
            <!-- ========================= -->

            <a
                class="card"
                href="https://www.facebook.com/profile.php?id=61591591047735"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="image-container">

                    <img
                        src="vecteezy_facebook-png-icon_16716481.png.png"
                        alt="Facebook"
                    >

                </div>


                <div class="card-content">

                    <div class="card-title">
                        Facebook
                    </div>

                    <div class="card-description">
                        Découvrez notre page Facebook
                    </div>

                </div>


                <div class="arrow">
                    →
                </div>

            </a>



            <!-- ========================= -->
            <!-- LINK 2 : INSTAGRAM -->
            <!-- ========================= -->

            <a
                class="card"
                href="https://www.instagram.com/audition_tunisie?igsh=MWRxb2g1MnJpaTR3NQ%3D%3D&fbclid=IwY2xjawTpyH5wZG9mBWV4dG4DYWVtAjEwAGJyaWQRMXRZb2RjZ1U3TThHVDlBdmdzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEeMd7ia9sZNh7Q61b5nzafjzjHXFLSk1gJ0OjgVEYKlieBMtyRHrKMQxRBo1I_aem_d9hzutyMg2FqjC3jP36pJg"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="image-container">

                    <img
                        src="instagram-6338393_1280.png.png"
                        alt="Instagram"
                    >

                </div>


                <div class="card-content">

                    <div class="card-title">
                        Instagram
                    </div>

                    <div class="card-description">
                        Retrouvez-nous sur Instagram
                    </div>

                </div>


                <div class="arrow">
                    →
                </div>

            </a>



            <!-- ========================= -->
            <!-- LINK 3 : GOOGLE MAPS -->
            <!-- ========================= -->

            <a
                class="card"
                href="https://www.google.com/maps/place/Audioproth%C3%A9siste+Ali+Baccouche/@36.8049664,10.1813747,17z/data=!3m1!4b1!4m6!3m5!1s0x12fd359fea01423d:0x890aae42e234f7ef!8m2!3d36.8049664!4d10.1813747!16s%2Fg%2F11tft827lc?entry=ttu&g_ep=EgoyMDI2MDgxMC4wIKXMDSoASAFQAw%3D%3D"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="image-container">

                    <img
                        src="2642502png.png"
                        alt="Google Maps"
                    >

                </div>


                <div class="card-content">

                    <div class="card-title">
                        Notre localisation
                    </div>

                    <div class="card-description">
                        Retrouvez-nous sur Google Maps
                    </div>

                </div>


                <div class="arrow">
                    →
                </div>

            </a>


        </section>


        <!-- FOOTER -->

        <footer class="footer">
            Powered by 
Centre de correction auditive Tunis
        </footer>


    </main>

</body>
</html>
